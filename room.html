<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>무용분야 심화 멘토링 안내</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--teal:#176C86;--deep:#1C6077;--ivory:#FAF9F5;--ink:#212326;--muted:#5F6368;--coral:#E84958;--apricot:#FFB098}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--deep);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  word-break:keep-all;overflow-wrap:break-word;line-height:1.6}
.card{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:32px 26px 26px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--teal)}
h1{font-size:24px;line-height:1.35;margin:8px 0 14px;font-weight:800}
p{margin:0 0 12px;font-size:16px;color:#3E4246}
.box{background:#E6F0F3;border-radius:14px;padding:14px 16px;margin:16px 0 18px;font-size:15.5px;color:#0F4252}
.box b{color:#0F4252}
.btn{display:block;text-align:center;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:15px;border-radius:12px}
.btn:hover{background:var(--deep)}
.foot{margin-top:18px;font-size:13.5px;color:var(--muted);text-align:center}
.foot a{color:var(--teal)}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">2026 K예술영재 프로젝트 · 무용분야 심화 멘토링</div>
  <h1>지금은 이용할 수 없는<br>페이지입니다</h1>
  <p>무용분야 심화 멘토링 3회차(12월 6일)는 ZOOM으로 진행합니다.</p>
  <div class="box">ZOOM 접속 링크는 멘토링 전에 <b>학생·보호자 연락처로 개별 안내</b>해 드립니다.</div>
  <a class="btn" href="https://kartsgifted.github.io/b_apply/">내 멘토링 시간 확인하기</a>
  <div class="foot">문의 <a href="mailto:kgifted2026@naver.com">kgifted2026@naver.com</a></div>
</main>
</body>
</html>
